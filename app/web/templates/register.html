{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 pt-12">
  <h1 class="font-display font-extrabold text-3xl text-ink">Create your account</h1>
  <form id="form" class="bg-white rounded-2xl p-6 mt-5 space-y-4">
    <div><label class="label" for="full_name">Full name</label><input id="full_name" name="full_name" class="field" autocomplete="name" required></div>
    <div><label class="label" for="email">University email</label><input id="email" name="email" type="email" class="field" autocomplete="email" required></div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div><label class="label" for="student_id">Student ID (optional)</label><input id="student_id" name="student_id" class="field"></div>
      <div><label class="label" for="department">Department (optional)</label><input id="department" name="department" class="field"></div>
    </div>
    <div><label class="label" for="password">Password</label><input id="password" name="password" type="password" class="field" minlength="8" autocomplete="new-password" required><p class="text-xs mt-1">At least 8 characters.</p></div>
    <p id="error" class="text-sm text-coral" role="alert"></p>
    <button id="submit" class="btn btn-primary w-full">Create account</button>
  </form>
  <p class="mt-4 text-center">Already have an account? <a href="/login" class="font-semibold text-brand hover:underline">Log in</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  const { api, setToken, safeNext, setBusy } = CEMF;
  document.getElementById("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target, btn = document.getElementById("submit"), err = document.getElementById("error");
    err.textContent = ""; setBusy(btn, true);
    try {
      await api("/auth/register", { method: "POST", body: {
        full_name: f.full_name.value.trim(), email: f.email.value.trim(), password: f.password.value,
        student_id: f.student_id.value.trim() || null, department: f.department.value.trim() || null } });
      const res = await api("/auth/login", { method: "POST", form: { username: f.email.value.trim(), password: f.password.value } });
      setToken(res.access_token);
      location.href = safeNext(new URLSearchParams(location.search).get("next"));
    } catch (e) { err.textContent = e.message; setBusy(btn, false); }
  });
</script>
{% endblock %}
