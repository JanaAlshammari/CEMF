{% extends "base.html" %}
{% block title %}Event report{% endblock %}
{% block content %}
<div id="page" class="hidden max-w-5xl mx-auto px-4 pt-8">
  <a href="/manage" class="no-print text-sm font-semibold text-brand hover:underline">Back to manage events</a>
  <div id="root" class="mt-2"><p>Loading report...</p></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const { api, download, esc, requireLogin, toast, setBusy, fmtDateTime, statusBadge, errorBox } = CEMF;
  const id = location.pathname.split("/").filter(Boolean).pop();
  const eid = encodeURIComponent(id);
  const num = (v, unit = "") => (v === null || v === undefined ? "No data" : `${v}${unit}`);

  const tile = (label, value, sub = "") => `<div class="bg-white rounded-2xl p-4"><p class="text-sm text-slate-500">${label}</p><p class="font-display font-extrabold text-3xl text-ink mt-1">${value}</p>${sub ? `<p class="text-xs mt-0.5">${sub}</p>` : ""}</div>`;
  const bar = (pct, color = "bg-brand") => `<div class="h-2.5 rounded-full bg-slate-200 overflow-hidden"><div class="h-full ${color}" style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>`;

  (async () => {
    const user = await requireLogin();
    if (!user) return;
    document.getElementById("page").classList.remove("hidden");
    const root = document.getElementById("root");
    try {
      const r = await api(`/events/${eid}/feedback/report`);
      document.title = `Report: ${r.event_title} | CEMF`;
      const A = r.averages;
      const aspects = [["Overall experience", A.overall], ["Content", A.content], ["Organisation", A.organization], ["Venue", A.venue]];
      const maxCount = Math.max(1, ...r.overall_distribution);

      root.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div><h1 class="font-display font-extrabold text-3xl md:text-4xl text-ink">${esc(r.event_title)}</h1><p class="mt-1">Event report ${statusBadge(r.event_status)}</p></div>
          <div class="no-print flex gap-2"><button id="csv" class="btn btn-ghost">Download CSV</button><button class="btn btn-ghost" onclick="window.print()">Print</button></div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
          ${tile("Registered", r.registered_total)}
          ${tile("Attended", r.attended_total, r.attendance_rate === null ? "" : `${r.attendance_rate}% of registered`)}
          ${tile("Feedback received", r.response_count, r.response_rate === null ? "" : `${r.response_rate}% of attendees`)}
          ${tile("Average rating", A.overall === null ? "None yet" : `${A.overall} / 5`)}
        </div>

        <div class="grid md:grid-cols-2 gap-4 mt-4">
          <section class="bg-white rounded-2xl p-5">
            <h2 class="font-display font-bold text-xl text-ink">Average by aspect</h2>
            <div class="mt-4 space-y-4">${aspects.map(([label, v]) => `
              <div><div class="flex justify-between text-sm"><span class="font-semibold text-ink">${label}</span><span>${v === null ? "No ratings" : `${v} / 5`}</span></div>
              <div class="mt-1">${bar(v === null ? 0 : (v / 5) * 100)}</div></div>`).join("")}</div>
          </section>
          <section class="bg-white rounded-2xl p-5">
            <h2 class="font-display font-bold text-xl text-ink">Overall rating spread</h2>
            <div class="mt-4 space-y-3">${[5, 4, 3, 2, 1].map((n) => `
              <div class="flex items-center gap-3"><span class="w-12 text-sm font-semibold text-ink">${n} star${n === 1 ? "" : "s"}</span>
              <div class="flex-1">${bar((r.overall_distribution[n - 1] / maxCount) * 100, n >= 4 ? "bg-brand" : n === 3 ? "bg-marigold" : "bg-coral")}</div>
              <span class="w-6 text-sm text-right">${r.overall_distribution[n - 1]}</span></div>`).join("")}</div>
          </section>
        </div>

        <section class="mt-6">
          <h2 class="font-display font-bold text-xl text-ink">Comments and suggestions</h2>
          <div class="mt-3 space-y-3">${r.comments.length ? r.comments.map((c) => `
            <article class="bg-white rounded-xl p-4">
              <div class="flex flex-wrap items-center gap-2 text-sm"><span class="badge bg-slate-100 text-ink">${c.overall_rating} / 5</span><span class="font-semibold text-ink">${c.author ? esc(c.author) : "Anonymous"}</span><span class="text-xs">${esc(fmtDateTime(c.created_at))}</span></div>
              ${c.comments ? `<p class="mt-2 whitespace-pre-line">${esc(c.comments)}</p>` : ""}
              ${c.suggestions ? `<p class="mt-2 whitespace-pre-line"><span class="font-semibold text-ink">To improve:</span> ${esc(c.suggestions)}</p>` : ""}
            </article>`).join("") : `<div class="bg-white rounded-xl p-6 text-center">No written feedback yet.</div>`}</div>
        </section>`;

      const csv = document.getElementById("csv");
      csv.addEventListener("click", async () => {
        setBusy(csv, true);
        try { await download(`/events/${eid}/feedback/report.csv`, `feedback-${id}.csv`); }
        catch (e) { toast(e.message, "error"); }
        setBusy(csv, false);
      });
    } catch (e) {
      root.innerHTML = e.status === 403
        ? `<div class="bg-white rounded-2xl p-8 text-center mt-4"><p class="font-display font-bold text-xl text-ink">You can't view this report</p><p class="mt-1">Reports are for the club's committee leaders and presidents.</p></div>`
        : e.status === 404 ? `<div class="bg-white rounded-2xl p-8 text-center mt-4"><p class="font-display font-bold text-xl text-ink">Event not found</p></div>`
        : `<div class="grid mt-4">${errorBox(e.message)}</div>`;
    }
  })();
</script>
{% endblock %}
