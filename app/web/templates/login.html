{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 pt-12">
  <h1 class="font-display font-extrabold text-3xl text-ink">Log in</h1>
  <form id="form" class="bg-white rounded-2xl p-6 mt-5 space-y-4">
    <div><label class="label" for="email">Email</label><input id="email" name="email" type="email" class="field" autocomplete="email" required></div>
    <div><label class="label" for="password">Password</label><input id="password" name="password" type="password" class="field" autocomplete="current-password" required></div>
    <p id="error" class="text-sm text-coral" role="alert"></p>
    <button id="submit" class="btn btn-primary w-full">Log in</button>
  </form>
  <p class="mt-4 text-center">New here? <a href="/register" class="font-semibold text-brand hover:underline">Create an account</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  const { api, setToken, safeNext, setBusy } = CEMF;
  document.getElementById("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target, btn = document.getElementById("submit"), err = document.getElementById("error");
    err.textContent = ""; setBusy(btn, true);
    try {
      const res = await api("/auth/login", { method: "POST", form: { username: f.email.value.trim(), password: f.password.value } });
      setToken(res.access_token);
      location.href = safeNext(new URLSearchParams(location.search).get("next"));
    } catch (e) { err.textContent = e.message; setBusy(btn, false); }
  });
</script>
{% endblock %}
