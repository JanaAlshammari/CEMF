{% extends "base.html" %}
{% block title %}Verify a certificate{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 pt-12">
  <h1 class="font-display font-extrabold text-3xl text-ink">Verify a certificate</h1>
  <p class="mt-2">Enter the verification code printed on the certificate.</p>
  <form id="form" class="bg-white rounded-2xl p-6 mt-5 flex gap-2">
    <input id="code" class="field" placeholder="A1B2-C3D4-E5F6-0789" autocomplete="off" aria-label="Verification code" required>
    <button class="btn btn-primary shrink-0">Verify</button>
  </form>
  <div id="result" class="mt-4" aria-live="polite"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const { api, esc, errorBox } = CEMF;
  const $ = (n) => document.getElementById(n);
  async function check(code) {
    $("result").innerHTML = "<p>Checking...</p>";
    try {
      const r = await api(`/certificates/verify/${encodeURIComponent(code)}`);
      $("result").innerHTML = r.valid ? `
        <div class="rounded-2xl bg-emerald-50 text-emerald-900 p-6">
          <p class="font-display font-bold text-xl">This certificate is genuine</p>
          <p class="mt-3"><span class="font-semibold">${esc(r.holder_name)}</span> attended <span class="font-semibold">${esc(r.event_title)}</span>, organised by ${esc(r.club_name)}.</p>
          <p class="text-sm mt-1">${esc(r.date_text)}. Attendance ${r.attendance_percentage}%.</p>
        </div>` : `<div class="rounded-2xl bg-red-50 text-red-700 p-6" role="alert"><p class="font-display font-bold text-xl">No certificate matches that code</p><p class="mt-1">Check the code and try again.</p></div>`;
    } catch (e) { $("result").innerHTML = `<div class="grid">${errorBox(e.message)}</div>`; }
  }
  $("form").addEventListener("submit", (ev) => { ev.preventDefault(); check($("code").value.trim()); });
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[1]) { $("code").value = decodeURIComponent(parts[1]); check($("code").value); }
</script>
{% endblock %}
